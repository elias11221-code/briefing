name: Morning Briefing

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet "garminconnect==0.3.2" requests cryptography

      - name: Build encrypted briefing
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: python briefing.py

      - name: Publish
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs/data.enc.json
          git commit -m "Briefing $(TZ=Europe/Berlin date +%F)" || echo "No changes"
          git push
